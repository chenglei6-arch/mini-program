# 反向代理配置：放到 /etc/nginx/conf.d/mini-program-backend.conf
# 后端自身监听 127.0.0.1:8080（见 deploy/.env.production.example 的 SERVER_PORT）。
#
# 两种常见接法：
#   A. 域名继续走 Cloudflare（推荐，改动最小）
#      在 Cloudflare 把 www.luolikongchenglei.asia 的解析从 Tunnel 改成 A 记录，
#      指向本服务器公网 IP，SSL/TLS 模式设为 Full (strict)，
#      证书用 Cloudflare Origin Certificate 放到 /etc/nginx/certs/ 下。
#   B. 不走 Cloudflare
#      用 certbot --nginx 签发 Let's Encrypt 证书，并删掉下面的 80 端口 location /。

server {
    listen      80;
    listen      [::]:80;
    server_name www.luolikongchenglei.asia luolikongchenglei.asia;

    # 走 Cloudflare 时这里只接受回源流量；走证书签发时保留 ACME 校验路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.luolikongchenglei.asia luolikongchenglei.asia;

    ssl_certificate     /etc/nginx/certs/luolikongchenglei.asia.pem;
    ssl_certificate_key /etc/nginx/certs/luolikongchenglei.asia.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 小程序上传/头像等请求体上限
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 后端已开启 server.forward-headers-strategy=framework，会按上述头取真实客户端 IP
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
