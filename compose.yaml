name: mini-program

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${DB_NAME:-mini_program}
      MYSQL_USER: ${DB_USERNAME:-mini_program_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    profiles: ["app"]
    build:
      context: .
    # 打上固定镜像名，服务器上 docker load 后 up --no-build 直接使用，不会在 1G 内存的
    # 服务器上误触发 Maven 构建。
    image: mini-program-backend:latest
    restart: unless-stopped
    # 把同目录 .env 的全部变量（WECHAT、OSS_* 等）注入容器；
    # 下面 environment 里的 DB_URL 优先级更高，仍指向容器内的 mysql 服务。
    env_file:
      - .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-mini_program}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-mini_program_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
